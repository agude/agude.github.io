# Surviving mutmut mutants of atproto/publish.py that are accepted, with the
# reason for each. `make test-mutations-scripts` runs
# ci/check_mutation_dispositions.py after mutmut. For every function listed
# under `functions`, the check fails on:
#   - a surviving mutant that is not listed under `survivors` (unlisted);
#   - a listed mutant that no longer survives (stale);
#   - a function whose source hash differs from the recorded one, because
#     mutmut numbers mutants by position and a source change can renumber them;
#   - a function whose mutants were only partly run.
# Survivors in functions not listed under `functions` are counted and printed
# as untriaged, but do not fail the check. Timeouts are printed, not gated.
#
# Fields:
#   functions    mutmut function name (x_<name>) -> source hash from
#                mutants/atproto/publish.py.meta (hash_by_function_name).
#   mutant       Full mutmut mutant name.
#   mutation     Short description of the change.
#   disposition  equivalent: the mutant cannot change observable behavior.
#                out_of_scope: the mutant changes wording only; tests assert
#                the identifying content (a path, URI, rule, or record name),
#                but do not pin prose.
#   reason       One sentence, specific to this mutant.
#
# sync_documents triage (mutmut 3.8.1, quick profile, 234 mutants): before the
# R11 tests, 163 killed, 70 survived, 1 timeout (mutant 192); after, 208
# killed, 26 survived, 0 timeouts. Mutant 192 (`updated += 1` -> `updated = 1`)
# was not a hang: the property failed and Hypothesis shrinking outran the
# timeout. TestSummaryLine now kills it directly. The empty-corpus guard added
# after R11 renumbered the later mutants by +6 and added survivors 50, 52, 53.


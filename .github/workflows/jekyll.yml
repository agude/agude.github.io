# .github/workflows/jekyll.yml
#
# Job graph. `test` and `build` start together; nothing waits for `test`
# except `publish`, which is the only job that writes to an external system.
#
#   test ─────────────────────────────┐
#   build ──┬── site-checks ──────────┤
#           └── browser-checks (x2) ──┴── publish (main) ── deploy (main)
#
# test (every branch):
#   1. `bundle exec rubocop` (lint).
#   2. Ruby tests (`load` every _tests/**/test_*.rb).
#   3. Python script tests in _scripts/ (setup-python + `uv run pytest`).
#   4. `_bin/check_strict.rb` (strict Liquid variables).
#   5. `atproto/publish.py validate` — parses every post and book review
#      for AT Protocol compatibility; no credentials or network required.
#   6. `atproto/publish.py publish --dry-run` — skipped on main; prints
#      what a merge would publish. No secrets: it reads public records
#      from bsky.social and refuses every write. Blocking, so a
#      bsky.social outage fails branch CI; rerun the job.
#
# build (every branch): builds the site and uploads it as the `site`
# artifact. It runs no gates: a job's dependents start only when the whole
# job ends, so gates here would delay the browser checks.
#
# site-checks (every branch): four gates over the `site` artifact: the
# AT-path cross-check (validate --site-dir, both directions), HTML structure
# (_bin/check_html_structure.sh), feed XML (_bin/check_feeds.rb), and
# broken links (_bin/check_links.rb).
#
# browser-checks (every branch): a two-entry matrix over the `site`
# artifact, each with headless Chromium from Playwright: responsive image
# sizes (_scripts/ci/check_image_sizes.py) and light/dark color switching
# (_scripts/ci/check_color_scheme.py). The browser download is cached by
# uv.lock; its apt dependencies are installed every run.
#
# publish (main only) needs every other job, so PDS records — an external,
# not-automatically-reversible system — are only written after ALL gates
# pass:
#   7. `uv run python atproto/publish.py publish` — syncs _posts/ and
#      _books/ (and the publication record from _config.yml) to the PDS
#      and writes _data/standard_site.json. Requires the BSKY_APP_PASSWORD
#      repo secret and a non-empty standard_site.publication_uri (an empty
#      value is a hard failure — repo rule 5).
#   8. A second Jekyll build embeds the per-document link tags. Both builds
#      read the same `time:` overlay (the build job's `build-time` output),
#      so `_bin/check_rebuild_diff.rb` can require the second build to
#      equal the gated first build apart from those tags. That carries the
#      first build's gate results over to the deployed artifact; only the
#      AT-path cross-check re-runs.
#
# Every job that runs Ruby sets RUBY_YJIT_ENABLE=1 and fails if YJIT is not
# active, so a Ruby built without YJIT cannot silently lose the speedup.
#
# Every job that builds installs ImageMagick from apt: the build's
# ImageDerivatives generator encodes WebP cover copies with it, and the Ruby
# tests encode real fixture images. Those jobs restore
# `.jekyll-cache/image-derivatives` with actions/cache (key: hash of
# books/covers/**, the JPEGs and PNGs under files/**, where post
# front-matter images live, the generator, and _config.yml, which sets the
# widths), so only new or changed images are encoded; a full miss adds
# about a minute. Post text is not in the key, so editing a post does not
# save a new cache. A post that starts using an image already in files/
# does not change the key; that one image is then encoded on each run until
# the next image change saves a new cache. An exact key hit never saves, so
# every input that changes the outputs must be in the key. ImageDerivatives
# rejects uppercase extensions, which these case-sensitive globs would
# miss. link-check.yml shares the same cache key.
#
# Builds also restore Jekyll's Markdown conversion cache
# (`.jekyll-cache/production`), saved under a per-commit key and restored
# from the newest one. It needs no key discipline: `_bin/prepare_build.rb`
# deletes it before the build unless its stored fingerprint (Gemfile.lock,
# Dockerfile, .ruby-version, _config*.yml, _plugins/**) still matches.
#
# Concurrency: `test` and `build` are per-ref and cancel stale runs.
# `publish` serializes per ref without cancellation: overlapping main
# publishes would race the listRecords→createRecord cycle and could create
# duplicate PDS records for the same post path. The deploy job's
# `group: pages` lock is scoped to deployment only so it can't starve runs
# on other branches.
name: Test and Deploy Jekyll site to Pages

on:
  # Runs on pushes to ANY branch
  push:

  # Allows you to run this workflow manually from the Actions tab.
  # skip_publish is the emergency escape hatch: main deploys are otherwise
  # hard-coupled to bsky.social uptime because the publish step gates the
  # deploy. A manual dispatch with skip_publish=true ships the site without
  # touching the PDS (the deploy then carries stale/absent document link
  # tags until the next normal main run).
  workflow_dispatch:
    inputs:
      skip_publish:
        description: "Skip the AT Protocol publish step (PDS outage escape hatch)"
        type: boolean
        default: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Test job - Runs on EVERY branch
  test:
    runs-on: ubuntu-latest
    env:
      RUBY_YJIT_ENABLE: "1"
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 0

      - name: Confirm YJIT is active
        run: ruby -e 'abort "RUBY_YJIT_ENABLE is set but YJIT is not active" unless RubyVM::YJIT.enabled?'

      # ImageDerivatives encodes WebP cover copies with ImageMagick.
      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends imagemagick

      - name: Run linter
        run: bundle exec rubocop

      - name: Run tests
        run: bundle exec ruby -I _plugins -I _tests -e "require 'test_helper'; Dir.glob('_tests/**/test_*.rb').each { |f| load f }"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Lint Python scripts
        run: make lint-scripts

      - name: Run script tests
        run: make test-scripts

      # Fast, credential-free subset of the build job's --site-dir
      # cross-check (keep the two invocations' flags in sync).
      - name: Validate posts for AT Protocol publish
        working-directory: _scripts
        run: uv run python atproto/publish.py validate --posts-dir ../_posts --books-dir ../_books

      # Shows what a merge would publish. Needs no secrets: the dry run
      # reads public records and refuses every write. Blocking, so a
      # bsky.social outage fails branch CI (rerun the job); main skips it
      # and keeps skip_publish for the real publish.
      - name: Dry-run AT Protocol publish
        if: github.ref != 'refs/heads/main'
        working-directory: _scripts
        run: uv run python atproto/publish.py publish --posts-dir ../_posts --books-dir ../_books --data-out "$RUNNER_TEMP/standard_site.json" --dry-run

      - name: Check for strict Liquid errors
        run: bundle exec ruby _bin/check_strict.rb

      - name: Check markdown reference links
        run: bundle exec ruby _bin/check_reference_links.rb

  # Build job - Runs on EVERY branch, in parallel with `test`
  build:
    runs-on: ubuntu-latest
    env:
      RUBY_YJIT_ENABLE: "1"
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      base-path: ${{ steps.pages.outputs.base_path }}
      build-time: ${{ steps.build-time.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 0

      - name: Confirm YJIT is active
        run: ruby -e 'abort "RUBY_YJIT_ENABLE is set but YJIT is not active" unless RubyVM::YJIT.enabled?'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # ImageDerivatives encodes WebP cover copies with ImageMagick.
      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends imagemagick

      # Encoded cover copies; ImageDerivatives re-encodes only what its
      # manifest marks stale, so a partial (restore-keys) hit still helps.
      - name: Restore image derivative cache
        uses: actions/cache@v6
        with:
          path: .jekyll-cache/image-derivatives
          key: image-derivatives-${{ hashFiles('books/covers/**', 'files/**/*.jpg', 'files/**/*.jpeg', 'files/**/*.png', '_plugins/src/infrastructure/image_derivatives.rb', '_config.yml') }}
          restore-keys: image-derivatives-

      # Validated by the fingerprint in prepare_build.rb, so any restored
      # entry is safe; see the header.
      - name: Restore Markdown conversion cache
        uses: actions/cache@v6
        with:
          path: |
            .jekyll-cache/production
            .jekyll-cache/production.fingerprint
          key: jekyll-conversions-${{ github.sha }}
          restore-keys: jekyll-conversions-

      # Both builds on main read this overlay; see the header. The offset
      # comes from the site's timezone so page timestamps keep their zone.
      - name: Fix the build time
        id: build-time
        run: |
          value=$(TZ=$(ruby -ryaml -e 'print YAML.load_file("_config.yml").fetch("timezone")') date +%Y-%m-%dT%H:%M:%S%:z)
          echo "value=$value" >> "$GITHUB_OUTPUT"
          printf 'time: "%s"\n' "$value" > "$RUNNER_TEMP/build_time.yml"

      - name: Build with Jekyll
        run: |
          ruby _bin/prepare_build.rb production
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" --config "_config.yml,.jekyll-cache/production.yml,$RUNNER_TEMP/build_time.yml"
        env:
          JEKYLL_ENV: production

      # Downstream jobs start when this job ends, so it runs no gates.
      # Covers are already compressed, so archive compression only costs
      # time. include-hidden-files keeps .well-known/.
      - name: Upload site for downstream jobs
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

  # Site checks - Run on EVERY branch against the build job's artifact
  site-checks:
    runs-on: ubuntu-latest
    needs: build
    env:
      RUBY_YJIT_ENABLE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 0

      - name: Confirm YJIT is active
        run: ruby -e 'abort "RUBY_YJIT_ENABLE is set but YJIT is not active" unless RubyVM::YJIT.enabled?'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: _site

      # The cross-check is a superset of the test job's credential-free
      # validate step (keep the two invocations' flags in sync).
      - name: Cross-check AT record paths against built site
        working-directory: _scripts
        run: uv run python atproto/publish.py validate --posts-dir ../_posts --books-dir ../_books --site-dir ../_site

      - name: Validate HTML structure
        run: ./_bin/check_html_structure.sh

      - name: Validate feed XML
        run: bundle exec ruby _bin/check_feeds.rb

      - name: Check for broken links
        run: bundle exec ruby _bin/check_links.rb

  # Browser checks - Run on EVERY branch against the build job's artifact
  browser-checks:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # Measures every image slot at each CSS breakpoint and density
          # (`make check-images`).
          - check: image-sizes
            script: ci/check_image_sizes.py
          # Loads every page in the light and dark color schemes and fails
          # when a probed color does not switch (`make check-colors`).
          - check: color-scheme
            script: ci/check_color_scheme.py
    name: browser-checks (${{ matrix.check }})
    steps:
      # The checks read _sass/ and _scripts/ from the repository.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: _site

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Restore Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('_scripts/uv.lock') }}

      - name: Install Chromium and its system libraries
        working-directory: _scripts
        run: uv run --group browser playwright install --with-deps --only-shell chromium

      - name: Run ${{ matrix.check }} check
        working-directory: _scripts
        run: uv run --group browser python ${{ matrix.script }} ../_site --baseurl "${{ needs.build.outputs.base-path }}"

  # Publish job - main only, after every gate
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, build, site-checks, browser-checks]
    env:
      RUBY_YJIT_ENABLE: "1"
    # Serialize per ref (no cancellation); see the header.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 0

      - name: Confirm YJIT is active
        run: ruby -e 'abort "RUBY_YJIT_ENABLE is set but YJIT is not active" unless RubyVM::YJIT.enabled?'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      # ImageDerivatives encodes WebP cover copies with ImageMagick.
      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends imagemagick

      - name: Restore image derivative cache
        uses: actions/cache@v6
        with:
          path: .jekyll-cache/image-derivatives
          key: image-derivatives-${{ hashFiles('books/covers/**', 'files/**/*.jpg', 'files/**/*.jpeg', 'files/**/*.png', '_plugins/src/infrastructure/image_derivatives.rb', '_config.yml') }}
          restore-keys: image-derivatives-

      - name: Restore Markdown conversion cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .jekyll-cache/production
            .jekyll-cache/production.fingerprint
          key: jekyll-conversions-${{ github.sha }}
          restore-keys: jekyll-conversions-

      - name: Download the gated first build
        uses: actions/download-artifact@v8
        with:
          name: site
          path: ${{ runner.temp }}/first-site

      - name: Publish standard.site records
        if: inputs.skip_publish != true
        working-directory: _scripts
        run: uv run python atproto/publish.py publish --posts-dir ../_posts --books-dir ../_books --data-out ../_data/standard_site.json
        env:
          BSKY_HANDLE: alexgude.com
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}

      # The first build ran without _data/standard_site.json (publish had
      # not run yet), so main rebuilds to embed the per-document link tags,
      # at the first build's time.
      - name: Rebuild with document link tags
        run: |
          printf 'time: "%s"\n' "${{ needs.build.outputs.build-time }}" > "$RUNNER_TEMP/build_time.yml"
          ruby _bin/prepare_build.rb production
          bundle exec jekyll build --baseurl "${{ needs.build.outputs.base-path }}" --config "_config.yml,.jekyll-cache/production.yml,$RUNNER_TEMP/build_time.yml"
        env:
          JEKYLL_ENV: production

      - name: Check the rebuild changed only document link tags
        run: bundle exec ruby _bin/check_rebuild_diff.rb "$RUNNER_TEMP/first-site" _site

      - name: Cross-check AT record paths against the final artifact
        working-directory: _scripts
        run: uv run python atproto/publish.py validate --posts-dir ../_posts --books-dir ../_books --site-dir ../_site

      # include-hidden-files is required: the action's tar excludes
      # dot-prefixed entries by default, which silently dropped
      # .well-known/site.standard.publication from the first deploy
      # while every _site-level gate stayed green.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: true

  # Deployment job
  deploy:
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: publish
    # This matches the publish job's condition: it uploaded the artifact.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Artifact-side proof that dot-path files actually deployed; the
      # build gates can only see _site/, not what the packaging step kept.
      - name: Smoke-test deployed .well-known
        run: |
          expected=$(grep -A2 '^standard_site:' _config.yml | grep publication_uri | sed 's/.*"\(at:[^"]*\)".*/\1/')
          echo "Expecting: $expected"
          for i in 1 2 3 4 5; do
            got=$(curl -fsS "${{ steps.deployment.outputs.page_url }}.well-known/site.standard.publication" || true)
            [ "$got" = "$expected" ] && echo "OK" && exit 0
            echo "attempt $i: got '$got'; retrying in 15s (CDN propagation)"
            sleep 15
          done
          echo "ERROR: deployed .well-known does not serve the publication URI"
          exit 1
